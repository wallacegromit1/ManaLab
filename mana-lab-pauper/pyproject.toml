[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mana-lab-pauper"
version = "0.1.0"
description = "Reproducible Pauper mana-base simulation and validation engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
mana-lab = "mana_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

