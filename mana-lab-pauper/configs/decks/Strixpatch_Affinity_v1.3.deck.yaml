policy_contract:
  information_boundary: "known hand + public battlefield + legally revealed scry cards + frozen deck knowledge only; never unseen future library order"
  land_baseline: >-
    Enumerate legal land plays; lexicographically maximize due-current-turn functional actions,
    preserve one opponent-turn interaction option when baseline reserve applies, maximize current
    usable mana, then known-hand color coverage; play a Bridge in a slack window when this tuple is unchanged.
  land_alternate: >-
    Enumerate legal land plays; maximize current untapped mana first, then due-current-turn actions,
    then known-hand color coverage. Same deterministic tie-break order for every candidate.
  action_baseline: >-
    Enumerate legal own-main action sequences from the visible state. Maximize due/overdue proactive
    spell executions, then end-of-main artifact count, then cards drawn/legally selected, then remaining
    untapped resources after preserving the baseline interaction reserve; minimize irreversible land loss.
    Interaction spells are not auto-cast without a target fixture.
  action_alternate: >-
    Tempo-first: maximize number of own-turn spell executions and current untapped-mana use before
    preserving interaction; otherwise uses identical legal-action generation and tie-breaks.
  opponent_reserve_baseline: >-
    Do not pre-float mana. If at least one held interactive spell has a current opponent-window demand,
    preserve untapped permanents sufficient for one legal option whenever doing so does not miss a hard
    current-turn proactive deadline. Select the option with minimum mana opportunity cost; report all
    other options counterfactually.
  opponent_reserve_alternate: "tap_out_development; reserve nothing solely for opponent turn, but still report opponent-window option availability"
  boulder_scry_baseline: >-
    Evaluate only the two legally revealed cards. Keep/order cards that solve a visible next-land-drop or
    due-color need first, then due-by-next-turn castable spells, then other in-horizon cards. Bottom cards
    with zero need score. Never inspect the unknown card below the scry pair.
  boulder_scry_alternate: >-
    Land-stability variant: among the two revealed cards prioritize a needed next land drop/color source,
    then in-window draw/development cards, then other in-horizon spells. Same no-lookahead boundary.
  mulligan_baseline: >-
    London mulligan. At 7/6/5-card final sizes, keep a drawn seven only if it contains 2-4 lands and,
    using visible cards only, a legal T1-T2 land sequence can provide two usable mana in a T2 main phase.
    If not, mulligan. At final size 4, keep automatically. After keeping, bottom exactly the mulligan count
    by exhaustive subset selection using the frozen lexicographic bottom rule.
  mulligan_alternate: >-
    London land-count stress test. At final sizes 7/6/5 keep any drawn seven containing 2-5 lands;
    otherwise mulligan. At final size 4 keep automatically. Use the same bottom rule.
  bottom_rule: >-
    Enumerate all required bottom subsets and keep the subset that lexicographically minimizes distance
    from target retained land count (6->2-3, 5->2, 4->1-2), maximizes visible T1-T2 usable mana, maximizes
    color coverage for kept spells due by T3, maximizes retained early-window actions, then uses canonical
    card-name tie breaks. No future library inspection.

# These are not scalar weights. They are named metric views evaluated from preserved raw events.
