      copies: 3
      mana_cost: "{U}{B}"
      mana_relevant_tags: [artifact, creature, joint_color_UB, etb_draw]
      rules_model:
        colored_cost: {U: 1, B: 1}
        etb_draw: 1
        artifact_on_battlefield: true
      timing: "own_turn"
      earliest_realistic_turn: 2
      desired_windows:
        baseline_practical: {2: 0.45, 3: 0.40, 4: 0.15}
        value_development: {2: 0.25, 3: 0.45, 4: 0.30}
      timing_assumption: "SUBJECTIVE; test both named profiles."

    - name: "Blood Fountain"
      copies: 1
      mana_cost: "{B}"
      mana_relevant_tags: [artifact, etb_token, blood_token, artifact_count]
      rules_model:
        colored_cost: {B: 1}
        etb_create_blood_token: 1
        blood_token_is_artifact: true
        blood_token_activation: {generic_mana: 1, tap: true, discard_cards: 1, sacrifice_self: true, draw: 1}
        late_recursion_activation: {generic_mana: 3, B: 1, tap: true, sacrifice_self: true}
      timing: "own_turn"
      earliest_realistic_turn: 1
      desired_windows:
        baseline_practical: {1: 0.45, 2: 0.35, 3: 0.15, 4: 0.05}
      timing_assumption: "SUBJECTIVE; early artifact development is the modeled reason, not an empirical cast-rate claim."

    - name: "Cryogen Relic"
