      mana_cost: "{1}{U}"
      mana_relevant_tags: [artifact, etb_draw, ltb_draw, sacrifice, glint_hawk_synergy]
      rules_model:
        generic_cost: 1
        colored_cost: {U: 1}
        etb_draw: 1
        leaves_battlefield_draw: 1
        activated_stun: {generic_mana: 1, U: 1, sacrifice_self: true, target_requires_tapped_creature: true}
      timing: "own_turn_primary; either_turn_option_for_activation"
      earliest_realistic_turn: 2
      desired_windows:
        baseline_practical: {2: 0.55, 3: 0.35, 4: 0.10}
        value_development: {2: 0.40, 3: 0.40, 4: 0.20}
      timing_assumption: "SUBJECTIVE; leave-trigger/Hawk value is decision-relevant and must be executed, not scored as a bonus."

    - name: "Dispatch"
      copies: 3
      mana_cost: "{W}"
      mana_relevant_tags: [instant, interaction, metalcraft, opponent_turn]
      rules_model:
        colored_cost: {W: 1}
        base_effect: "tap_target_creature"
        full_effect_condition: {artifact_count_at_resolution_gte: 3}
        full_effect: "exile_target_creature"
      timing: "either_turn"
      earliest_realistic_turn: 1
      desired_windows:
        baseline_practical: {1: 0.10, 2: 0.35, 3: 0.35, 4: 0.20}
        interaction_frontloaded: {1: 0.20, 2: 0.45, 3: 0.25, 4: 0.10}
      timing_assumption: "SUBJECTIVE; report raw W castability separately from Metalcraft full-effect availability."

    - name: "Galvanic Blast"
      copies: 4
      mana_cost: "{R}"
      mana_relevant_tags: [instant, interaction, metalcraft, opponent_turn]
      rules_model:
        colored_cost: {R: 1}
        base_damage: 2
        full_effect_condition: {artifact_count_at_resolution_gte: 3}
        full_effect_damage: 4
      timing: "either_turn"
      earliest_realistic_turn: 1
      desired_windows:
        baseline_practical: {1: 0.25, 2: 0.35, 3: 0.25, 4: 0.15}
        interaction_frontloaded: {1: 0.40, 2: 0.35, 3: 0.15, 4: 0.10}
      timing_assumption: "SUBJECTIVE; full-effect availability is distinct from red-source access."

    - name: "Giant's Boulder"
      copies: 4
      mana_cost: "{1}"
      mana_relevant_tags: [artifact, fixing, filter, tap_resource, scry_2]
      rules_model:
        generic_cost: 1
        etb_scry: 2
        filter_activation: {generic_mana: 1, tap_self: true, output: "one_mana_any_color"}
        filter_is_ramp: false
        late_destroy_activation: {generic_mana: 7, tap_self: true, sacrifice_self: true, target: "permanent"}
